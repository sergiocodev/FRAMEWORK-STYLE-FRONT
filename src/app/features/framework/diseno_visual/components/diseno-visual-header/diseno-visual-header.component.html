<!-- Segmented Progress Bar -->
<div class="header-progress-bar d-flex w-100 mb-2">
  <div *ngFor="let phase of phases" 
       class="progress-segment flex-fill"
       [ngClass]="{
         'segment-completed': phase.status === 'completed',
         'segment-active': phase.status === 'active',
         'segment-upcoming': phase.status === 'upcoming'
       }"
       [title]="phase.name">
  </div>
</div>

<!-- Phase Header / Stepper -->
<div class="container-fluid mb-1">
  <div class="bg-white rounded p-3 shadow-sm border border-light">
    <div class="d-flex align-items-center gap-3">
      <div class="header-icon-container" style="background-color: rgba(37, 99, 235, 0.1); color: #2563EB; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
          <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </svg>
      </div>
      <div>
        <h4 class="mb-1 fw-bold d-flex align-items-center gap-2">
          Fase 3: Diseño Visual
        </h4>
        <div class="text-muted" style="font-size: 0.9rem;">
          <span class="fw-medium text-secondary-emphasis">Cliente:</span> <span class="opacity-75 me-2">{{ project?.client || 'Cliente Interno' }}</span> | 
          <span class="ms-2">Estilos, tipografías y componentes visuales.</span>
        </div>
      </div>
    </div>
  </div>
</div>
