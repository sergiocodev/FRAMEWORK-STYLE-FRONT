<div class="diseno-visual-container min-vh-100 bg-light d-flex flex-column" style="background-color: #F8FAFC !important;">
  
  <!-- Main Unified Page Header -->
  <app-page-header 
    [title]="project?.title || 'Diseño Visual'" 
    [breadcrumbs]="headerBreadcrumbs"
    [showSearch]="false">
    
    <!-- Header Badges -->
    <div header-badges class="d-flex align-items-center gap-2">
      <span class="badge rounded-pill text-success bg-success-subtle border-0 px-3 py-1 fw-semibold" style="font-size: 0.75rem;">
        {{ formattedStatus }}
      </span>
      <span class="badge rounded-pill text-secondary bg-secondary-subtle border-0 px-3 py-1 fw-medium" style="font-size: 0.75rem;">
        {{ project?.type || 'Web' }}
      </span>
    </div>

    <!-- Right Side Actions -->
    <div class="d-flex align-items-center gap-2 gap-md-3">
      
      <!-- Auto-save / Cloud Sync Indicator -->
      <div class="d-none d-md-flex align-items-center gap-2 text-secondary px-2" style="font-size: 0.82rem;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span class="text-success fw-medium">Tokens Sincronizados</span>
      </div>

      <!-- Preview Modal Trigger -->
      <button type="button" class="btn btn-outline-secondary d-flex align-items-center gap-2 px-3 py-2 rounded-3 shadow-xs transition-all" 
              (click)="openPreviewModal()" title="Ver Guía Visual Completa (Bento Tokens)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span class="fw-medium d-none d-sm-inline">Vista Previa</span>
      </button>

      <!-- Complete Phase 3 Button -->
      <button type="button" class="btn btn-primary-gradient d-flex align-items-center gap-2 px-3 px-md-4 py-2 rounded-3 shadow-sm" 
              (click)="completePhase()" [disabled]="isCompleting">
        @if (isCompleting) {
          <span class="spinner-border spinner-border-sm text-white" role="status" aria-hidden="true"></span>
        }
        <span class="fw-semibold">Siguiente: Fase 4</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </app-page-header>

  <!-- Main Container -->
  <main class="container-fluid px-3 px-md-4 py-3 flex-grow-1 d-flex flex-column">

    <!-- Phase Stepper & Context Banner -->
    <app-diseno-visual-header 
      [project]="project" 
      [phases]="phases"
      [totalProgress]="totalProgressPercentage"
      [completedSystems]="completedSystemsCount"
      [totalSystems]="5">
    </app-diseno-visual-header>

    <!-- Validation Error Toast / Alert -->
    @if (validationError) {
    <div class="alert alert-warning border-0 shadow-sm rounded-4 d-flex align-items-center justify-content-between p-3 mb-3 fade show" role="alert">
      <div class="d-flex align-items-center gap-3">
        <div class="alert-icon-box bg-warning-subtle text-warning rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 36px; height: 36px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div>
          <span class="fw-bold text-dark d-block">Requisitos pendientes para avanzar</span>
          <span class="text-secondary small">{{ validationError }}</span>
        </div>
      </div>
      <button type="button" class="btn-close ms-2" (click)="validationError = null" aria-label="Cerrar"></button>
    </div>
    }

    <!-- Visual Design Library Workspace -->
    <div class="row gx-4 h-100 flex-grow-1">
      <div class="col-12 h-100 pb-2 d-flex flex-column">
        <div class="h-100 pb-4 overflow-auto custom-scrollbar">
          @if (currentProjectId) {
            <app-diseno-visual-library 
              [proyectoId]="currentProjectId"
              (openPreview)="openPreviewModal()"
              (complete)="completePhase()">
            </app-diseno-visual-library>
          }
        </div>
      </div>
    </div>
  </main>

  <!-- Fullscreen Preview Modal (BrandBook Studio) -->
  <app-modal [isOpen]="isPreviewModalOpen" (closeEvent)="closePreviewModal()" size="full"
             title="Guía Visual y BrandBook Studio (Tokens v2.0)">
    <div modal-body class="h-100 w-100">
      <app-diseno-visual-preview></app-diseno-visual-preview>
    </div>
  </app-modal>

</div>
