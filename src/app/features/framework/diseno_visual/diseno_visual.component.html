<div class="diseno-visual-container min-vh-100 bg-light d-flex flex-column" style="background-color: #F8FAFC !important;">
  <!-- Page Header (Reusable Navigation) -->
  <app-page-header 
    [title]="project.title || 'Diseño Visual'" 
    [breadcrumbs]="headerBreadcrumbs"
    [showSearch]="false">
    
    <div header-badges class="d-flex align-items-center gap-2">
      <span class="badge rounded-pill text-success bg-success-subtle border-0 px-3 py-1 fw-medium" style="font-size: 0.75rem;">
        {{ formattedStatus }}
      </span>
      <span class="badge rounded-pill text-secondary bg-secondary-subtle border-0 px-3 py-1 fw-medium" style="font-size: 0.75rem;">
        {{ project.type || 'Web' }}
      </span>
    </div>

    <!-- Right Side Actions -->
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-outline-primary d-flex align-items-center gap-2 shadow-sm rounded-3 px-3 transition-all" (click)="openPreviewModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        Vista Previa
      </button>
      <button class="btn d-flex align-items-center gap-2 px-4 py-2" style="background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%); color: white; border: none; font-weight: 500; border-radius: 8px;" (click)="completePhase()" [disabled]="isCompleting">
        @if (isCompleting) {
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        }
        <span>Siguiente: Fase 4</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </app-page-header>

  <!-- Header Navbar and Phase Stepper -->
  <app-diseno-visual-header [project]="project" [phases]="phases"></app-diseno-visual-header>

  <!-- Main Content -->
  <div class="container-fluid pt-2 pb-4 flex-grow-1 d-flex flex-column overflow-hidden">
    <div class="row gx-4 h-100 flex-grow-1">
      <!-- Center Column: Biblioteca de estilos -->
      <div class="col-12 h-100 pb-2 d-flex flex-column">
        <!-- Botones movidos al Page Header -->
        <div class="h-100 pb-5 overflow-auto custom-scrollbar">
          @if (currentProjectId) {
            <app-diseno-visual-library [proyectoId]="currentProjectId"></app-diseno-visual-library>
          }
        </div>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <app-modal [isOpen]="isPreviewModalOpen" (closeEvent)="closePreviewModal()" size="full"
    title="Vista Previa de la Guia Visual">
    <div modal-body>
      <app-diseno-visual-preview></app-diseno-visual-preview>
    </div>
  </app-modal>
</div>
