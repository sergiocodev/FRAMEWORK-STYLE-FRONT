<div class="container-fluid p-4" style="background-color: #f8fafc; min-height: 100vh;">
  <!-- Header Navbar and Phase Stepper -->
  <app-diseno-visual-header [project]="project" [phases]="phases"></app-diseno-visual-header>

  <div class="row gx-4">
    <!-- Center Column: Biblioteca de estilos -->
    <div class="col-12">
      <div class="d-flex justify-content-end mb-3 gap-3">
        <button class="btn btn-outline-primary d-flex align-items-center gap-2 shadow-sm" (click)="openPreviewModal()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          Vista Previa
        </button>
        <button
          class="btn btn-success d-flex align-items-center gap-2 shadow-sm rounded-3 px-3 transition-all"
          style="font-weight: 500;" (click)="completePhase()" [disabled]="isCompleting">
          @if (isCompleting) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          }
          Aprobar y Continuar a Fase 4
        </button>
      </div>
      <div class="h-100 pb-5">
        <app-diseno-visual-library></app-diseno-visual-library>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <app-modal [isOpen]="isPreviewModalOpen" (closeEvent)="closePreviewModal()" size="large"
    title="Vista Previa de la Guia Visual">
    <div modal-body>
      <div class="bg-white rounded p-4 shadow-sm border border-light" style="min-height: 60vh;">
        <app-diseno-visual-preview></app-diseno-visual-preview>
      </div>
    </div>
  </app-modal>
</div>
