<div class="users-card bg-white rounded-4 shadow-sm border p-4 mb-3 flex-shrink-0">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div class="card-header-content">
      <div class="d-flex align-items-center gap-3 mb-2">
        <h6 class="card-title fw-bold mb-0">Usuarios</h6>
      </div>
      <p class="card-description mb-0">
        Define los perfiles de usuarios (arquetipos) y sus principales necesidades.
      </p>
    </div>

    <button (click)="addUser()" class="btn btn-custom-soft-primary d-flex align-items-center gap-2 px-3 py-2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Añadir arquetipo</span>
    </button>
  </div>

  <div class="row g-4 mt-1">
    <!-- Arquetipos Cards -->
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let user of usuarios; let i = index">
      <app-user-archetype-card [user]="user" (userChange)="updateUser(user)" (remove)="removeUser(i)">
      </app-user-archetype-card>
    </div>
  </div>
</div>
