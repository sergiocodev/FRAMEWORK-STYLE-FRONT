<div class="resources-card bg-white rounded-4 shadow-sm border p-4 mb-3 flex-shrink-0">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div class="card-header-content">
      <div class="d-flex align-items-center gap-3 mb-2">
        <h6 class="card-title fw-bold mb-0">Recursos y Restricciones</h6>
      </div>
      <p class="card-description mb-0">
        Registra restricciones técnicas, detalles de marca y adjunta los recursos útiles.
      </p>
    </div>
  </div>

  <div class="mb-4">
    <label class="form-label fw-medium mb-1" style="font-size: 0.85rem;">Restricciones Técnicas</label>
    <div class="textarea-wrapper">
      <textarea class="form-control custom-textarea" rows="2"
        placeholder="Plataformas (Web, iOS), resoluciones, tecnologías requeridas, etc." [ngModel]="restricciones"
        (ngModelChange)="onRestriccionesChange($event)"></textarea>
    </div>
  </div>

  <div class="mb-4 p-3 bg-light rounded-3 border">
    <label class="form-label fw-medium mb-3 d-block" style="font-size: 0.85rem;">Identidad Institucional</label>

    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="tieneManual" [(ngModel)]="identidadMarca.tieneManual"
        (ngModelChange)="onIdentidadMarcaChange()">
      <label class="form-check-label ms-2" for="tieneManual" style="font-size: 0.85rem;">¿Cuenta con manual de marca o
        lineamientos visuales?</label>
    </div>

    <div class="mb-3">
      <label class="form-label text-secondary mb-1" style="font-size: 0.75rem;">Colores Principales</label>
      <input type="text" class="form-control custom-input" placeholder="Ej. Azul primario (#003366), Naranja secundario"
        [(ngModel)]="identidadMarca.colores" (ngModelChange)="onIdentidadMarcaChange()">
    </div>

    <div>
      <label class="form-label text-secondary mb-1" style="font-size: 0.75rem;">Otras notas de marca (Tipografía,
        logo)</label>
      <input type="text" class="form-control custom-input"
        placeholder="Ej. Usar logo en versión blanca, tipografía Arial" [(ngModel)]="identidadMarca.notas"
        (ngModelChange)="onIdentidadMarcaChange()">
    </div>
  </div>

  <label class="form-label fw-medium mb-2" style="font-size: 0.85rem;">Archivos Adjuntos</label>
  <!-- Drag and Drop Area -->
  <div class="upload-zone mb-4" [class.is-dragging]="isDragging" (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)" (drop)="onDrop($event)" (click)="fileInput.click()">

    <input type="file" #fileInput multiple class="d-none" (change)="onFileSelected($event)">

    <div class="upload-icon-circle mb-3">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
    </div>
    <h6 class="upload-title mb-1">Arrastra y suelta tus archivos aquí</h6>
    <p class="upload-subtitle mb-2">o haz clic para seleccionar</p>
    <p class="upload-meta mb-0">
      Formatos permitidos: PDF, PNG, JPG, ZIP <span class="mx-1 opacity-50">•</span> Tamaño máximo: 10 MB
    </p>
  </div>

  <!-- Uploaded Files List -->
  <div class="row g-3">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let file of recursos; let i = index">
      <div class="file-card d-flex align-items-center justify-content-between p-3">
        <div class="d-flex align-items-center gap-3 overflow-hidden">

          <div class="file-icon-box pdf" *ngIf="file.type === 'pdf'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>

          <div class="file-icon-box image" *ngIf="file.type === 'image'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </div>

          <div class="file-icon-box zip" *ngIf="file.type === 'zip'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
          </div>

          <div class="overflow-hidden">
            <h6 class="file-name text-truncate mb-0" [title]="file.name">{{ file.name }}</h6>
            <p class="file-size mb-0">{{ file.size }}</p>
          </div>
        </div>

        <button (click)="removeFile(i)" class="btn btn-icon-danger ms-2 flex-shrink-0" title="Eliminar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
