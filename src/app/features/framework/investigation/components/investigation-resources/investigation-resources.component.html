<div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <div class="d-flex align-items-center gap-2 text-primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <h6 class="fw-bold mb-0 text-dark">3. Recursos</h6>
      </div>
      <p class="text-secondary small mb-0 mt-1">Adjunta los recursos que ayudarán a comprender el contexto del
        proyecto.</p>
    </div>
  </div>

  <!-- Drag and Drop Area -->
  <div
    class="border border-2 border-dashed rounded-4 p-4 text-center cursor-pointer mb-4 upload-zone transition-all"
    [ngClass]="isDragging ? 'bg-primary bg-opacity-10 border-primary' : 'hover-bg-light'"
    style="border-color: #cbd5e1 !important; border-style: dashed !important;"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="fileInput.click()">
    
    <input type="file" #fileInput multiple style="display: none" (change)="onFileSelected($event)">
    
    <div
      class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3 transition-all"
      [ngClass]="isDragging ? 'bg-primary text-white scale-up' : ''"
      style="width: 48px; height: 48px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
    </div>
    <h6 class="fw-bold text-dark mb-1">Arrastra y suelta tus archivos aquí</h6>
    <p class="text-primary mb-2 small fw-medium">o haz clic para seleccionar</p>
    <p class="text-secondary small mb-0" style="font-size: 0.75rem;">Formatos permitidos: PDF, PNG, JPG, ZIP
      <span class="mx-1">•</span> Tamaño máximo: 10 MB
    </p>
  </div>

  <!-- Uploaded Files List -->
  <div class="row g-3">
    <div class="col-12 col-md-4" *ngFor="let file of recursos; let i = index">
      <div
        class="d-flex align-items-center justify-content-between border rounded-3 p-2 px-3 bg-white shadow-sm hover-lift">
        <div class="d-flex align-items-center gap-3 overflow-hidden">
          <div class="text-danger flex-shrink-0" *ngIf="file.type === 'pdf'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <div class="text-purple flex-shrink-0" style="color: #8b5cf6;" *ngIf="file.type === 'image'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </div>
          <div class="text-warning flex-shrink-0" style="color: #f59e0b;" *ngIf="file.type === 'zip'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
          </div>
          <div class="overflow-hidden">
            <h6 class="text-dark fw-medium mb-0 text-truncate" style="font-size: 0.8rem;" [title]="file.name">{{ file.name }}</h6>
            <p class="text-secondary small mb-0" style="font-size: 0.7rem;">{{ file.size }}</p>
          </div>
        </div>
        <button (click)="removeFile(i)" class="btn btn-link text-secondary p-0 ms-2 hover-text-danger flex-shrink-0" title="Eliminar"><svg width="16" height="16"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg></button>
      </div>
    </div>
  </div>
</div>
