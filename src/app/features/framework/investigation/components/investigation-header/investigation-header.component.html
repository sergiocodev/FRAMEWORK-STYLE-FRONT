<header class="investigation-header sticky-top z-3">
  <div class="investigation-header-top d-flex flex-wrap align-items-center justify-content-between gap-4 px-4 py-3">

    <!-- Project Info (Left) -->
    <div class="d-flex align-items-center gap-3">
      <div class="header-icon-container">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
          <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </svg>
      </div>
      <div>
        <div class="d-flex align-items-center gap-2 mb-1">
          <h4 class="project-title mb-0">{{ project?.title || 'Nuevo Proyecto de Investigación' }}</h4>
          <span class="project-badge status-active">{{ project?.status || 'En progreso' }}</span>
        </div>
        <p class="project-meta mb-0">
          <span class="fw-medium text-secondary-emphasis">Tipo:</span> <span class="opacity-75">{{ project?.type || 'Estudio de mercado' }}</span> 
          <span class="separator">|</span> 
          <span class="fw-medium text-secondary-emphasis">Cliente:</span> <span class="opacity-75">{{ project?.client || 'Cliente Interno' }}</span>
        </p>
      </div>
    </div>

    <!-- Actions (Right) -->
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-custom-outline d-flex align-items-center gap-2 px-3 py-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span>Guardar borrador</span>
      </button>
      
      <button class="btn btn-custom-primary d-flex align-items-center gap-2 px-4 py-2">
        <span>Siguiente: Fase 2</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <!-- Stepper Component -->
  <div class="stepper-container px-4 pt-3 pb-2">
    <app-stepper [phases]="phases"></app-stepper>
  </div>
</header>
