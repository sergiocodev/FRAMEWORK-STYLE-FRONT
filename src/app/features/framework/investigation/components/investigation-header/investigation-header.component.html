<!-- Segmented Progress Bar across Framework Phases -->
<div class="header-progress-container mb-3">
  <div class="d-flex align-items-center justify-content-between mb-1 px-1">
    <div class="d-flex align-items-center gap-2">
      <span class="stepper-title fw-semibold text-secondary">
        Fase 1 - Investigación y Descubrimiento
      </span>
      <span class="text-black-50">|</span>
      <span><strong class="text-dark">Cliente:</strong> {{ project?.client || 'Cliente General' }}</span>
      <span class="text-black-50">|</span>
      <span>Define el problema, objetivos, usuarios y requerimientos iniciales.</span>
    </div>
    <div class="stepper-meta text-muted small" style="font-size: 0.75rem;">
      Fase 1 de 5 · Investigación
    </div>
  </div>

  <div class="header-progress-bar d-flex w-100">
    <div *ngFor="let phase of phases; let i = index" class="progress-segment flex-fill" [ngClass]="{
           'segment-completed': phase.status === 'completed',
           'segment-active': phase.status === 'active',
           'segment-upcoming': phase.status === 'upcoming'
         }" [title]="'Fase ' + (i + 1) + ': ' + phase.name">
      <div class="segment-indicator"></div>
    </div>
  </div>
</div>
