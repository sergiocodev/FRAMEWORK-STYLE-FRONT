<!-- Preview Toolbar -->
<div class="preview-toolbar flex-shrink-0 mb-4">



  <!-- Bottom Row: Badge & Button -->
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 w-100">

    <!-- Right: Download PDF Button -->
    <div class="d-flex justify-content-end" style="flex: 1;">
      <button class="btn btn-premium-gradient d-flex align-items-center gap-2 px-3 py-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Descargar PDF</span>
      </button>
    </div>
  </div>

</div>

<!-- A4 Document Preview Wrapper -->
<div
  class="document-workspace d-flex justify-content-center bg-light p-4 p-md-4 rounded-4 shadow-inner flex-grow-1 overflow-auto custom-scrollbar">
  <!-- A4 Document Sheet -->
  <div class="document-sheet bg-white p-5" style="font-family: 'Inter', sans-serif;">
    <div [innerHTML]="safeMarkdown"></div>
  </div>
</div>
