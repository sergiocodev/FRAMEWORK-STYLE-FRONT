<!-- Preview Toolbar -->
<div class="preview-toolbar flex-shrink-0 mb-4">

  <!-- Top Row: Title -->
  <div class="d-flex align-items-center gap-3 mb-2 w-100">
    <div class="icon-container">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
    </div>
    <h5 class="fw-bold mb-0 text-dark">Vista previa del Informe de Investigación</h5>
  </div>

  <!-- Bottom Row: Badge & Button -->
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 w-100">
    <!-- Left spacing to keep badge perfectly centered -->
    <div class="d-none d-md-block" style="flex: 1;"></div>

    <!-- Center: Real-time update badge -->
    <div class="d-flex justify-content-center" style="flex: 1;">
      <span class="badge-status status-active d-flex align-items-center gap-2 px-3 py-2 border rounded-pill"
        style="border-color: rgba(var(--bs-success-rgb), 0.2) !important;">
        <div class="pulse-dot"></div> <span class="fw-medium text-capitalize" style="font-size: 0.75rem;">Actualización en
          tiempo real</span>
      </span>
    </div>

    <!-- Right: Download PDF Button -->
    <div class="d-flex justify-content-end" style="flex: 1;">
      <button class="btn btn-premium-gradient d-flex align-items-center gap-2 px-3 py-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Descargar PDF</span>
      </button>
    </div>
  </div>

</div>

<!-- A4 Document Preview Wrapper -->
<div
  class="document-workspace d-flex justify-content-center bg-light p-4 p-md-4 rounded-4 shadow-inner flex-grow-1 overflow-auto custom-scrollbar">
  <!-- A4 Document Sheet -->
  <div class="document-sheet bg-white p-5" style="font-family: 'Inter', sans-serif;">
    <div [innerHTML]="safeMarkdown"></div>
  </div>
</div>
