<!-- Preview Toolbar -->
<div class="d-flex justify-content-between align-items-center mb-3 flex-shrink-0">
  <div class="d-flex align-items-center gap-2">
    <h5 class="fw-bold mb-0 text-dark">Vista previa del Informe de Investigación</h5>
  </div>

  <div class="d-flex align-items-center gap-3">
    <span
      class="badge bg-success bg-opacity-10 text-success rounded-pill fw-medium d-flex align-items-center gap-1 px-2 py-1 border border-success border-opacity-25"
      style="font-size: 0.7rem;">
      <div class="rounded-circle bg-success" style="width: 6px; height: 6px;"></div> Actualización en tiempo real
    </span>
    <div class="bg-white rounded-3 shadow-sm border d-flex p-1">
      <button
        class="btn btn-sm btn-primary bg-primary bg-opacity-10 rounded-2 px-3 text-primary fw-medium border-0 d-flex align-items-center gap-2 hover-bg-primary-hover">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Vista previa
      </button>
    </div>
  </div>
</div>

<!-- A4 Document Preview Area -->
<div class="document-preview-container bg-white shadow-sm flex-grow-1 p-5 overflow-auto custom-scrollbar border"
  style="font-family: 'Inter', sans-serif; border-radius: 4px;">
  
  <div [innerHTML]="safeMarkdown"></div>
  
</div>
