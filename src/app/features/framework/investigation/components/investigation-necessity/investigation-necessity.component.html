<div class="card necessity-card border-0 p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center gap-3">
      <div class="icon-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <h6 class="card-title fw-bold mb-0">1. Necesidad</h6>
    </div>
    
    <button class="btn btn-icon-secondary">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>
  
  <p class="card-description mb-4">
    Describe el problema o necesidad que se busca resolver con el proyecto.
  </p>
  
  <div class="textarea-wrapper">
    <textarea class="form-control custom-textarea" rows="5"
      placeholder="Escribe la necesidad con el mayor nivel de detalle posible..."
      [ngModel]="necesidad"
      (ngModelChange)="onNecesidadChange($event)"></textarea>
      
    <div class="textarea-footer d-flex justify-content-end mt-2">
      <span class="char-counter" [class.text-danger]="necesidad.length >= 1000">
        {{ necesidad.length || 0 }} <span class="opacity-50">/ 1000</span>
      </span>
    </div>
  </div>
</div>
