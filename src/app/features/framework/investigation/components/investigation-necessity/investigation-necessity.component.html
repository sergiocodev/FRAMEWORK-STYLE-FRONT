<div class="necessity-card bg-white rounded-4 shadow-sm border p-4 mb-3 flex-shrink-0">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center gap-3">
      <h6 class="card-title fw-bold mb-0">Comprender el proyecto</h6>
    </div>
  </div>

  <p class="card-description mb-4">
    Describe el problema que origina el proyecto, su objetivo principal y las características del producto o módulo a
    diseñar.
  </p>

  <div class="mb-4">
    <label class="form-label fw-medium mb-1" style="font-size: 0.85rem;">Problema o Necesidad</label>
    <div class="textarea-wrapper">
      <textarea class="form-control custom-textarea" rows="3" placeholder="¿Qué problema o necesidad se busca resolver?"
        [ngModel]="problema" (ngModelChange)="onProblemaChange($event)"></textarea>
    </div>
  </div>

  <div class="mb-4">
    <label class="form-label fw-medium mb-1" style="font-size: 0.85rem;">Objetivo del Proyecto</label>
    <div class="textarea-wrapper">
      <textarea class="form-control custom-textarea" rows="2"
        placeholder="¿Qué se espera lograr con el diseño de esta interfaz?" [ngModel]="objetivo"
        (ngModelChange)="onObjetivoChange($event)"></textarea>
    </div>
  </div>

  <div>
    <label class="form-label fw-medium mb-1" style="font-size: 0.85rem;">Descripción del Producto</label>
    <div class="textarea-wrapper">
      <textarea class="form-control custom-textarea" rows="2"
        placeholder="Información sobre el sistema, app o módulo (ej. Dashboard web, App móvil)" [ngModel]="producto"
        (ngModelChange)="onProductoChange($event)"></textarea>
    </div>
  </div>

</div>
