          <div class="card border-0 shadow-sm rounded-4 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="d-flex align-items-center gap-2 text-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                  <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <h6 class="fw-bold mb-0 text-dark">1. Necesidad</h6>
              </div>
              <button class="btn btn-link text-secondary p-0"><svg width="20" height="20" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg></button>
            </div>
            <p class="text-secondary small mb-3">Describe el problema o necesidad que se busca resolver con el proyecto.
            </p>
            <div class="position-relative">
              <textarea class="form-control rounded-3 border-light bg-light shadow-none p-3 text-secondary" rows="5"
                placeholder="Escribe la necesidad..."
                style="font-size: 0.9rem; resize: none;"
                [ngModel]="necesidad"
                (ngModelChange)="onNecesidadChange($event)"></textarea>
              <div class="text-end mt-2">
                <span class="text-secondary small" style="font-size: 0.75rem;">{{ necesidad.length || 0 }}/1000</span>
              </div>
            </div>
          </div>
