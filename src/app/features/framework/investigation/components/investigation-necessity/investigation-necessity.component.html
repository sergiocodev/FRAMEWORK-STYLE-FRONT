<div class="card necessity-card border-0 p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center gap-3">
      <div class="icon-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <h6 class="card-title fw-bold mb-0">1. Comprender el proyecto</h6>
    </div>
  </div>
  
  <p class="card-description mb-4">
    Describe el problema que origina el proyecto, su objetivo principal y las características del producto o módulo a diseñar.
  </p>
  
  <div class="mb-4">
    <label class="form-label fw-medium mb-1" style="font-size: 0.85rem;">Problema o Necesidad</label>
    <div class="textarea-wrapper">
      <textarea class="form-control custom-textarea" rows="3"
        placeholder="¿Qué problema o necesidad se busca resolver?"
        [ngModel]="problema"
        (ngModelChange)="onProblemaChange($event)"></textarea>
    </div>
  </div>

  <div class="mb-4">
    <label class="form-label fw-medium mb-1" style="font-size: 0.85rem;">Objetivo del Proyecto</label>
    <div class="textarea-wrapper">
      <textarea class="form-control custom-textarea" rows="2"
        placeholder="¿Qué se espera lograr con el diseño de esta interfaz?"
        [ngModel]="objetivo"
        (ngModelChange)="onObjetivoChange($event)"></textarea>
    </div>
  </div>

  <div>
    <label class="form-label fw-medium mb-1" style="font-size: 0.85rem;">Descripción del Producto</label>
    <div class="textarea-wrapper">
      <textarea class="form-control custom-textarea" rows="2"
        placeholder="Información sobre el sistema, app o módulo (ej. Dashboard web, App móvil)"
        [ngModel]="producto"
        (ngModelChange)="onProductoChange($event)"></textarea>
    </div>
  </div>

</div>
