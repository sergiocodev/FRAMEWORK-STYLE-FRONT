@if (isLoading) {
<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
    <span class="visually-hidden">Cargando...</span>
  </div>
</div>
} @else if (error) {
<div class="d-flex flex-column justify-content-center align-items-center min-vh-100 bg-light text-center">
  <div class="bg-white p-5 rounded-4 shadow-sm border">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" class="mb-4">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="15" y1="9" x2="9" y2="15"></line>
      <line x1="9" y1="9" x2="15" y2="15"></line>
    </svg>
    <h4 class="fw-bold text-dark">Proyecto no encontrado</h4>
    <p class="text-secondary mb-0 mt-2">No se pudo cargar la información del proyecto o hubo un error de conexión.</p>
  </div>
</div>
} @else {
<div class="investigation-container min-vh-100 bg-light d-flex flex-column"
  style="background-color: #F8FAFC !important;">

  <!-- Header Navbar -->
  <app-investigation-header [project]="project" [phases]="phases" [isSaving]="isSaving"
    [saveSuccess]="saveSuccess"></app-investigation-header>

  <!-- Main Content -->
  <div class="container-fluid pt-2 pb-4 flex-grow-1 d-flex flex-column overflow-hidden">

    <div class="row g-4 h-100 flex-grow-1">

      <!-- Main Panel: Form Inputs -->
      <div class="col-12 flex-column h-100 pb-2 d-flex">

        <div class="main-section-header mb-3 ps-2 flex-shrink-0">

          <div class="d-flex align-items-center justify-content-end w-100" style="min-height: 42px;">

            <div class="d-flex align-items-center gap-3">
              <!-- Preview Button -->
              <button
                class="btn btn-outline-primary d-flex align-items-center gap-2 shadow-sm rounded-3 px-3 transition-all"
                style="font-weight: 500;" (click)="isModalOpen = true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                Vista Previa
              </button>
            </div>
          </div>
        </div>

        <div class="row g-4 pb-2 flex-grow-1 overflow-auto custom-scrollbar">

          <!-- 1. Necesidad -->
          <div class="col-12 col-xl-6 d-flex flex-column">
            <app-investigation-necessity class="flex-grow-1 d-flex flex-column" [(problema)]="problema"
              [(objetivo)]="objetivo" [(producto)]="producto">
            </app-investigation-necessity>
          </div>

          <!-- 2. Expectativas y Referencias -->
          <div class="col-12 col-xl-6 d-flex flex-column">
            <app-investigation-expectations class="flex-grow-1 d-flex flex-column" [(expectativas)]="expectativas"
              [(referencias)]="referencias" [(analisisActual)]="analisisActual">
            </app-investigation-expectations>
          </div>

          <!-- 3. Usuarios -->
          <div class="col-12 col-xl-6 d-flex flex-column">
            <app-investigation-users class="flex-grow-1 d-flex flex-column" [(usuarios)]="usuarios">
            </app-investigation-users>
          </div>

          <!-- 4. Recursos -->
          <div class="col-12 col-xl-6 d-flex flex-column">
            <app-investigation-resources class="flex-grow-1 d-flex flex-column" [(recursos)]="recursos"
              [(restricciones)]="restricciones" [(identidadMarca)]="identidadMarca">
            </app-investigation-resources>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- Preview Modal -->
<app-modal [isOpen]="isModalOpen" title="Vista Previa de Investigación" size="large" (closeEvent)="isModalOpen = false">

  <div modal-body class="h-100 w-100 d-flex flex-column" style="min-height: 70vh;">
    <app-investigation-preview class="d-flex flex-column h-100 w-100" [project]="project" [problema]="problema"
      [objetivo]="objetivo" [producto]="producto" [expectativas]="expectativas" [referencias]="referencias"
      [analisisActual]="analisisActual" [usuarios]="usuarios" [recursos]="recursos" [restricciones]="restricciones"
      [identidadMarca]="identidadMarca">
    </app-investigation-preview>
  </div>
</app-modal>
}
