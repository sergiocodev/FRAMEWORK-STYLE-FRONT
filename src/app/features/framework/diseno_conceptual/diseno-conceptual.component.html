@if (isLoading) {
  <div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>
} @else if (error && !project?.title) {
  <div class="d-flex flex-column justify-content-center align-items-center min-vh-100 bg-light text-center">
    <div class="bg-white p-5 rounded-4 shadow-sm border">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-4">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
      <h4 class="fw-bold text-dark">Proyecto no encontrado</h4>
      <p class="text-secondary mb-0 mt-2">No se pudo cargar la información del proyecto o hubo un error de conexión.</p>
    </div>
  </div>
} @else {
  <div class="diseno-container min-vh-100 bg-light d-flex flex-column"
    style="background-color: #F8FAFC !important;">
    
    <!-- Header Navbar -->
    <app-diseno-header [project]="project" [phases]="phases"></app-diseno-header>

    <!-- Main Content -->
    <div class="container-fluid py-4 flex-grow-1 d-flex flex-column overflow-hidden">
      <div class="row g-4 h-100 flex-grow-1" cdkDropListGroup>

        <!-- Left Panel: Canvas -->
        <div class="col-12 col-xl-8 d-flex flex-column h-100 pb-2">
          <app-diseno-canvas class="h-100" [projectId]="projectId"></app-diseno-canvas>
        </div>

        <!-- Right Panel: Inventory & Tools -->
        <div class="col-12 col-xl-4 d-flex flex-column h-100 pb-2 overflow-auto custom-scrollbar pe-2">
          <!-- Espaciador y Botón Avanzar -->
          <div class="mb-3 px-1 d-flex justify-content-end align-items-center" style="min-height: 50px;">
            <button
              class="btn btn-success d-flex align-items-center gap-2 shadow-sm rounded-3 px-3 transition-all"
              style="font-weight: 500;" (click)="completePhase()" [disabled]="isCompleting">
              @if (isCompleting) {
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              } @else {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              }
              Aprobar y Continuar a Fase 3
            </button>
          </div>
          
          <app-diseno-inventory [projectId]="projectId"></app-diseno-inventory>
          <app-diseno-wireframes [projectId]="projectId"></app-diseno-wireframes>
        </div>

      </div>
    </div>
  </div>
}
