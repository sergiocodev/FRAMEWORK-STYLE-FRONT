<div class="bg-white rounded-4 shadow-sm border p-4 mb-3 flex-shrink-0">
  <div class="d-flex align-items-center gap-2 mb-3">
    <div class="bg-success rounded-circle p-1 text-white d-flex align-items-center justify-content-center" style="width: 24px; height: 24px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h6 class="fw-bold mb-0 text-dark">Checklist de evaluación</h6>
  </div>

  <div class="d-flex flex-column gap-3">
    @for (item of checklist; track item.id) {
      <div class="d-flex align-items-start gap-2">
        <div class="form-check mt-1">
          <input class="form-check-input" type="checkbox" 
                 [checked]="item.estado === 'aceptado'"
                 (change)="toggleCheck(item, $event)"
                 [id]="'check_' + item.id">
        </div>
        <div class="flex-grow-1 d-flex justify-content-between align-items-center">
          <label class="form-check-label text-dark small fw-medium" [for]="'check_' + item.id">
            {{ item.pregunta }}
          </label>
        </div>
      </div>
    }
    @if (checklist.length === 0) {
      <div class="text-secondary small fst-italic text-center">
        No hay ítems en el checklist.
      </div>
    }
  </div>
</div>
