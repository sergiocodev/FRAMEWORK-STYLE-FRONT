<div class="register-wrapper">
  
  <div class="background-elements">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="register-card">
    <div class="card-header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <h2>Crea tu cuenta</h2>
      <p>Únete a STYLE para administrar tu sistema</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      
      <div class="form-group">
        <label for="full_name">Nombre Completo</label>
        <div class="input-container" [class.has-error]="registerForm.get('full_name')?.invalid && registerForm.get('full_name')?.touched">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <input id="full_name" type="text" formControlName="full_name" placeholder="Ej. Juan Pérez">
        </div>
        <span class="error-text" *ngIf="registerForm.get('full_name')?.invalid && registerForm.get('full_name')?.touched">
          El nombre completo es obligatorio
        </span>
      </div>

      <div class="form-group">
        <label for="username">Usuario</label>
        <div class="input-container" [class.has-error]="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
          <input id="username" type="text" formControlName="username" placeholder="Ej. juanperez" autocomplete="username">
        </div>
        <span class="error-text" *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
          El usuario es obligatorio (mín. 3 caracteres)
        </span>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-container" [class.has-error]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <input id="email" type="email" formControlName="email" placeholder="ej. correo@style.com" autocomplete="email">
        </div>
        <span class="error-text" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          Ingresa un correo electrónico válido
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-container" [class.has-error]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input id="password" type="password" formControlName="password" placeholder="••••••••" autocomplete="new-password">
        </div>
        <span class="error-text" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          Contraseña inválida (mín. 6 caracteres)
        </span>
      </div>

      <div class="alert-box error" *ngIf="errorMessage">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Registrarse</span>
        <div class="spinner" *ngIf="isLoading"></div>
      </button>

      <div class="login-redirect">
        <span>¿Ya tienes una cuenta?</span>
        <a routerLink="/login">Inicia sesión aquí</a>
      </div>

    </form>
  </div>
</div>
