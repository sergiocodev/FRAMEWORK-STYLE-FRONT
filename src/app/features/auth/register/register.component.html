<div class="register-wrapper d-flex align-items-center justify-content-center min-vh-100 position-relative">
  <a routerLink="/" class="floating-back-btn text-decoration-none">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    <span class="back-text">Volver al inicio</span>
  </a>
  
  <div class="background-elements">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="register-card position-relative z-1 w-100 mx-3 mx-md-auto p-4 p-md-5 rounded-4 border border-light border-opacity-50">
    <div class="text-center mb-4">
      <div class="logo mx-auto mb-3 d-flex align-items-center justify-content-center rounded-4 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <h2 class="fw-bold mb-2 text-dark">Crea tu cuenta</h2>
      <p class="text-muted mb-0">Únete a STYLE para administrar tu sistema</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      
      <div class="mb-3">
        <label for="full_name" class="form-label fw-medium text-dark small mb-1">Nombre Completo</label>
        <div class="input-group shadow-sm">
          <span class="input-group-text bg-white text-muted">
            <svg style="width:18px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </span>
          <input id="full_name" type="text" class="form-control py-2" [class.is-invalid]="registerForm.get('full_name')?.invalid && registerForm.get('full_name')?.touched" formControlName="full_name" placeholder="Ej. Juan Pérez">
          <div class="invalid-feedback" *ngIf="registerForm.get('full_name')?.invalid && registerForm.get('full_name')?.touched">
            El nombre completo es obligatorio
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="username" class="form-label fw-medium text-dark small mb-1">Usuario</label>
        <div class="input-group shadow-sm">
          <span class="input-group-text bg-white text-muted">
            <svg style="width:18px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
            </svg>
          </span>
          <input id="username" type="text" class="form-control py-2" [class.is-invalid]="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" formControlName="username" placeholder="Ej. juanperez" autocomplete="username">
          <div class="invalid-feedback" *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
            El usuario es obligatorio (mín. 3 caracteres)
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label fw-medium text-dark small mb-1">Correo Electrónico</label>
        <div class="input-group shadow-sm">
          <span class="input-group-text bg-white text-muted">
            <svg style="width:18px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </span>
          <input id="email" type="email" class="form-control py-2" [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" formControlName="email" placeholder="ej. correo@style.com" autocomplete="email">
          <div class="invalid-feedback" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
            Ingresa un correo electrónico válido
          </div>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-medium text-dark small mb-1">Contraseña</label>
        <div class="input-group shadow-sm">
          <span class="input-group-text bg-white text-muted">
            <svg style="width:18px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </span>
          <input id="password" type="password" class="form-control py-2" [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" formControlName="password" placeholder="••••••••" autocomplete="new-password">
          <div class="invalid-feedback" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
            Contraseña inválida (mín. 6 caracteres)
          </div>
        </div>
      </div>

      <div class="alert alert-danger d-flex align-items-center py-2 mb-3" role="alert" *ngIf="errorMessage">
        <svg style="width:20px; margin-right:8px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div class="small fw-medium">{{ errorMessage }}</div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 shadow-sm d-flex align-items-center justify-content-center custom-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading" class="fw-semibold">Registrarse</span>
        <div class="spinner-border spinner-border-sm text-light" role="status" *ngIf="isLoading">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </button>

      <div class="text-center mt-4 small text-secondary">
        <span>¿Ya tienes una cuenta?</span>
        <a routerLink="/login" class="text-primary fw-semibold text-decoration-none ms-1 custom-link">Inicia sesión aquí</a>
      </div>

    </form>
  </div>
</div>
