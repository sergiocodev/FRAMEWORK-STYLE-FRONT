<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100 position-relative">
  <a routerLink="/" class="floating-back-btn text-decoration-none">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    <span class="back-text">Volver al inicio</span>
  </a>
  
  <div class="background-elements">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="login-card position-relative z-1 w-100 mx-3 mx-md-auto p-4 p-md-5 rounded-4 border border-light border-opacity-50">
    <div class="text-center mb-4">
      <div class="logo mx-auto mb-3 d-flex align-items-center justify-content-center rounded-4 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h2 class="fw-bold mb-2 text-dark">Bienvenido de nuevo</h2>
      <p class="text-muted mb-0">Ingresa a tu panel de control Style</p>
    </div>

    <div class="d-flex justify-content-center mb-4 mt-3">
      <asl-google-signin-button type="standard" size="large"></asl-google-signin-button>
    </div>

    <div class="d-flex align-items-center text-center mb-4 text-muted small">
      <div class="flex-grow-1 border-bottom border-light-subtle"></div>
      <span class="px-3">o ingresa con tu correo</span>
      <div class="flex-grow-1 border-bottom border-light-subtle"></div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <div class="mb-3">
        <label for="username" class="form-label fw-medium text-dark small mb-1">Usuario o Correo</label>
        <div class="input-group shadow-sm">
          <span class="input-group-text bg-white text-muted">
            <svg style="width:18px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </span>
          <input id="username" type="text" class="form-control py-2" [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" formControlName="username" placeholder="ej. admin@style.com" autocomplete="username">
          <div class="invalid-feedback" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            El usuario es obligatorio
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-medium text-dark small mb-1">Contraseña</label>
        <div class="input-group shadow-sm">
          <span class="input-group-text bg-white text-muted">
            <svg style="width:18px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </span>
          <input id="password" type="password" class="form-control py-2" [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" formControlName="password" placeholder="••••••••" autocomplete="current-password">
          <div class="invalid-feedback" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            Contraseña inválida (mín. 4 caracteres)
          </div>
        </div>
      </div>

      <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="form-check mb-0 d-flex align-items-center">
          <input class="form-check-input mt-0 me-2" type="checkbox" id="rememberMe">
          <label class="form-check-label small text-muted cursor-pointer" for="rememberMe" style="cursor: pointer;">
            Recordarme
          </label>
        </div>
        <a href="#" class="text-primary fw-medium text-decoration-none small custom-link">¿Olvidaste tu contraseña?</a>
      </div>

      <div class="alert alert-danger d-flex align-items-center py-2 mb-3" role="alert" *ngIf="errorMessage">
        <svg style="width:20px; margin-right:8px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div class="small fw-medium">{{ errorMessage }}</div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 shadow-sm d-flex align-items-center justify-content-center custom-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading" class="fw-semibold">Ingresar al Sistema</span>
        <div class="spinner-border spinner-border-sm text-light" role="status" *ngIf="isLoading">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </button>

      <div class="text-center mt-4 small text-secondary">
        <span>¿No tienes una cuenta?</span>
        <a routerLink="/register" class="text-primary fw-semibold text-decoration-none ms-1 custom-link">Regístrate aquí</a>
      </div>

    </form>
  </div>
</div>
