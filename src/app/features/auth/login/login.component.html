<div class="login-wrapper">
  
  <div class="background-elements">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="login-card">
    <div class="card-header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h2>Bienvenido de nuevo</h2>
      <p>Ingresa a tu panel de control Style</p>
    </div>

    <div class="social-login" style="display: flex; justify-content: center; margin-top: 1rem; margin-bottom: 1.5rem;">
      <asl-google-signin-button type="standard" size="large"></asl-google-signin-button>
    </div>

    <div class="divider" style="display: flex; align-items: center; text-align: center; margin-bottom: 1.5rem; color: #94a3b8; font-size: 0.85rem;">
      <div style="flex: 1; border-bottom: 1px solid #e2e8f0;"></div>
      <span style="padding: 0 10px;">o ingresa con tu correo</span>
      <div style="flex: 1; border-bottom: 1px solid #e2e8f0;"></div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <div class="form-group">
        <label for="username">Usuario o Correo</label>
        <div class="input-container" [class.has-error]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <input id="username" type="text" formControlName="username" placeholder="ej. admin@style.com" autocomplete="username">
        </div>
        <span class="error-text" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          El usuario es obligatorio
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-container" [class.has-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input id="password" type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <span class="error-text" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Contraseña inválida (mín. 4 caracteres)
        </span>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox">
          <span>Recordarme</span>
        </label>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <div class="alert-box error" *ngIf="errorMessage">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Ingresar al Sistema</span>
        <div class="spinner" *ngIf="isLoading"></div>
      </button>

      <div class="login-redirect" style="text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #64748b;">
        <span>¿No tienes una cuenta?</span>
        <a routerLink="/register" style="color: #4f46e5; font-weight: 600; text-decoration: none; margin-left: 0.4rem;">Regístrate aquí</a>
      </div>

    </form>
  </div>
</div>
