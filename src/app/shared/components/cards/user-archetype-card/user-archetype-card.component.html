<div class="card h-100 rounded-3 border bg-white shadow-sm hover-lift position-relative">
  <div class="card-body p-3">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div class="d-flex align-items-center gap-2 w-100">
        <i class="bi bi-person-circle text-secondary flex-shrink-0"
          style="font-size: 30px; line-height: 30px; width: 30px; height: 30px;"></i>
        <div class="w-100 d-flex flex-column gap-1 align-items-start">

          <div contenteditable="true" class="border-0 fw-bold text-dark p-0 bg-transparent editable-div"
            style="font-size: 0.85rem; outline: none; min-width: 50px; cursor: text;" [textContent]="user.role"
            (blur)="user.role = $any($event.target).textContent; emitChanges()"
            (keydown.enter)="$event.preventDefault(); $any($event.target).blur()" data-placeholder="Rol...">
          </div>
          <div contenteditable="true" class="border-0 text-secondary small p-0 bg-transparent editable-div"
            style="font-size: 0.75rem; outline: none; min-width: 50px; cursor: text;" [textContent]="user.name"
            (blur)="user.name = $any($event.target).textContent; emitChanges()"
            (keydown.enter)="$event.preventDefault(); $any($event.target).blur()" data-placeholder="Nombre ficticio...">
          </div>
        </div>
      </div>
      <button (click)="remove.emit()" class="btn btn-link text-muted p-0 m-0 flex-shrink-0 ms-2" title="Eliminar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <ul class="list-unstyled mb-0 ms-1">
      <li *ngFor="let need of user?.needs; let j = index; trackBy: trackByIndex"
        class="text-secondary small d-flex gap-2 align-items-start mb-2" style="font-size: 0.75rem;">
        <span class="text-primary mt-2" style="font-size: 0.5rem;">●</span>
        <div contenteditable="true" class="border-0 bg-light p-1 px-2 text-secondary w-100 rounded editable-div"
          style="outline: none; cursor: text; min-height: 24px; font-size: 0.75rem;" [textContent]="user.needs[j]"
          (blur)="user.needs[j] = $any($event.target).textContent; emitChanges()"
          (keydown.enter)="$event.preventDefault(); $any($event.target).blur()"
          data-placeholder="Escribe una necesidad...">
        </div>
        <button (click)="removeNeed(j)" class="btn btn-sm btn-link text-muted p-0 mt-1 ms-1 hover-text-danger">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </li>
    </ul>
    <button (click)="addNeed()"
      class="btn btn-sm btn-link text-primary text-decoration-none p-0 ms-3 mt-1 d-flex align-items-center gap-1"
      style="font-size: 0.7rem;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Añadir necesidad
    </button>
  </div>
</div>
