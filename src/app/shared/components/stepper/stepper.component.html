<div class="stepper-line-wrapper w-100 overflow-auto py-4 px-2">
  <div class="d-flex position-relative z-0" style="min-width: 700px;">
    <div *ngFor="let phase of phases; let first = first; let last = last" 
         class="step-node-container flex-fill position-relative d-flex flex-column align-items-center"
         [ngClass]="{
           'active-node': phase.status === 'active',
           'completed-node': phase.status === 'completed',
           'upcoming-node': phase.status === 'upcoming'
         }">
      
      <!-- Connecting lines (Left and Right halves) -->
      <div *ngIf="!first" class="position-absolute start-0 top-0 w-50 step-line" 
           [ngClass]="(phase.status === 'completed' || phase.status === 'active') ? 'line-filled' : 'line-empty'"
           style="height: 4px; z-index: -1; margin-top: 24px;"></div>
           
      <div *ngIf="!last" class="position-absolute end-0 top-0 w-50 step-line" 
           [ngClass]="phase.status === 'completed' ? 'line-filled' : 'line-empty'"
           style="height: 4px; z-index: -1; margin-top: 24px;"></div>

      <!-- Icon Node -->
      <div class="step-node rounded-circle d-flex align-items-center justify-content-center bg-white transition-all shadow-sm position-relative"
           style="width: 52px; height: 52px; z-index: 1;">
         
         <!-- Completed state -->
         <ng-container *ngIf="phase.status === 'completed'">
           <div class="w-100 h-100 rounded-circle d-flex align-items-center justify-content-center text-white icon-completed shadow-sm">
             <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
           </div>
         </ng-container>
         
         <!-- Active state -->
         <ng-container *ngIf="phase.status === 'active'">
           <div class="w-100 h-100 rounded-circle d-flex align-items-center justify-content-center icon-active">
             <div class="active-dot rounded-circle"></div>
             <!-- Glowing outer ring -->
             <div class="pulse-ring position-absolute w-100 h-100 rounded-circle"></div>
           </div>
         </ng-container>

         <!-- Upcoming state -->
         <ng-container *ngIf="phase.status === 'upcoming'">
           <div class="w-100 h-100 rounded-circle d-flex align-items-center justify-content-center icon-upcoming text-secondary fw-bold fs-5 border border-2">
             {{ phase.number }}
           </div>
         </ng-container>
      </div>

      <!-- Text below -->
      <div class="text-center mt-3 px-2">
        <h6 class="fw-bold mb-1 transition-all" 
            [ngClass]="{
              'text-active': phase.status === 'active',
              'text-completed': phase.status === 'completed',
              'text-upcoming': phase.status === 'upcoming'
            }"
            style="letter-spacing: -0.01em;">
          {{ phase.name }}
        </h6>
        <p class="small mb-0 lh-sm transition-all" 
           [ngClass]="{
             'text-muted': phase.status !== 'upcoming',
             'text-upcoming-sub': phase.status === 'upcoming'
           }"
           style="font-size: 0.8rem; max-width: 140px; margin: 0 auto;">
          {{ phase.subtext }}
        </p>
      </div>
    </div>
  </div>
</div>
