<div class="stepper-wrapper d-flex gap-3 overflow-auto pb-2">
  <div *ngFor="let phase of phases" 
       class="step-card flex-fill rounded-4 p-3 border d-flex align-items-center gap-3 bg-white"
       [ngClass]="{
         'active-step border-primary bg-primary bg-opacity-10': phase.status === 'active',
         'border-light shadow-sm': phase.status !== 'active'
       }">
    
    <!-- Completed Icon -->
    <div *ngIf="phase.status === 'completed'" class="step-icon-container bg-success text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 36px; height: 36px; background-color: #10b981 !important;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>

    <!-- Active Icon -->
    <div *ngIf="phase.status === 'active'" class="step-icon-container position-relative rounded-circle d-flex align-items-center justify-content-center flex-shrink-0 text-white shadow-sm" style="width: 36px; height: 36px; font-weight: 700; background-color: #2563EB; z-index: 1;">
      <!-- Outer glow ring -->
      <div class="position-absolute top-50 start-50 translate-middle rounded-circle bg-primary opacity-25" style="width: 48px; height: 48px; z-index: -1;"></div>
      {{ phase.number }}
    </div>

    <!-- Upcoming Icon -->
    <div *ngIf="phase.status === 'upcoming'" class="step-icon-container rounded-circle d-flex align-items-center justify-content-center flex-shrink-0 bg-white text-dark border border-2 fw-bold" style="width: 36px; height: 36px; border-color: #e2e8f0 !important; color: #1e293b !important;">
      {{ phase.number }}
    </div>

    <!-- Text content -->
    <div>
      <div class="fw-bold mb-0 lh-1" [ngClass]="phase.status === 'active' ? 'text-primary' : 'text-dark'" style="font-size: 0.85rem; color: #1e293b;">
        {{ phase.name }}
      </div>
      <div class="text-secondary small mt-1 lh-1" style="font-size: 0.75rem; white-space: nowrap; color: #64748b;">
        {{ phase.subtext }}
      </div>
    </div>
  </div>
</div>
