<header class="bg-white border-bottom shadow-sm px-4 py-3 sticky-top" style="z-index: 1020;">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
    
    <!-- Title & Breadcrumbs -->
    <div>
      <nav aria-label="breadcrumb" *ngIf="breadcrumbs && breadcrumbs.length > 0">
        <ol class="breadcrumb mb-1">
          <li class="breadcrumb-item" 
              *ngFor="let item of breadcrumbs; let last = last" 
              [class.active]="item.active || last" 
              [attr.aria-current]="(item.active || last) ? 'page' : null">
            <a *ngIf="item.url && !item.active && !last" [routerLink]="item.url" class="text-decoration-none text-muted">
              {{ item.label }}
            </a>
            <span *ngIf="!item.url || item.active || last" [ngClass]="(item.active || last) ? 'fw-medium text-dark' : 'text-muted'">
              {{ item.label }}
            </span>
          </li>
        </ol>
      </nav>
      
      <div class="d-flex align-items-center gap-3">
        <h3 *ngIf="title" class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
          {{ title }}
        </h3>
        <ng-content select="[header-badges]"></ng-content>
      </div>
    </div>

    <!-- Actions (Search & Buttons) -->
    <div class="d-flex align-items-center gap-3 w-100 justify-content-md-end" style="max-width: 500px;">
      
      <!-- Search Bar -->
      <div *ngIf="showSearch" class="input-group search-bar rounded-pill overflow-hidden border shadow-sm flex-grow-1">
        <span class="input-group-text bg-white border-0 pe-1 text-muted">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input type="text" 
               class="form-control border-0 shadow-none bg-white" 
               [placeholder]="searchPlaceholder"
               aria-label="Buscar" 
               [ngModel]="searchTerm" 
               (ngModelChange)="onSearchTermChange($event)">
      </div>

      <!-- Projected Actions (Buttons, Dropdowns) -->
      <ng-content></ng-content>
      
    </div>
  </div>
</header>
