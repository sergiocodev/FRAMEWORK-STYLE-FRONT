<header class="header-container px-4 py-3 d-flex align-items-center justify-content-between sticky-top z-3" style="height: 70px;">
  
  <!-- Left Side: Search Bar (Global) -->
  <div class="d-flex align-items-center" style="width: 300px;">
    <div class="input-group custom-search overflow-hidden">
      <span class="input-group-text bg-transparent border-0 pe-1" id="global-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input type="text" class="form-control border-0 ps-1 bg-transparent shadow-none custom-search-input" placeholder="Buscar en STYLE..." aria-label="Buscar" aria-describedby="global-search" style="font-size: 0.9rem;">
    </div>
  </div>

  <!-- Right Side: User Controls -->
  <div class="d-flex align-items-center gap-3">
    
    <!-- Theme Toggle -->
    <div class="cursor-pointer header-icon-wrapper" (click)="toggleTheme()" title="Cambiar tema">
      <!-- Sun icon (shows when dark mode is active) -->
      <svg *ngIf="themeService.isDarkTheme$ | async" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <!-- Moon icon (shows when light mode is active) -->
      <svg *ngIf="!(themeService.isDarkTheme$ | async)" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </div>

    <!-- Notifications -->
    <div class="position-relative cursor-pointer header-icon-wrapper">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-white rounded-circle" style="width: 10px; height: 10px; margin-top: 6px; margin-left: -6px;">
        <span class="visually-hidden">Nuevas notificaciones</span>
      </span>
    </div>

    <!-- Divider -->
    <div class="vr mx-1" style="height: 24px; color: #E5E7EB; opacity: 1;"></div>

    <!-- User Profile Dropdown -->
    <div class="dropdown">
      <div class="d-flex align-items-center gap-2 cursor-pointer p-1 pe-2 rounded-3 user-dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
        <img [src]="user.avatarUrl" alt="Avatar" class="rounded-circle border" width="36" height="36">
        <div class="d-none d-md-block">
          <div class="user-name">{{ user.name }}</div>
          <div class="user-role">Admin</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-secondary ms-1"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      
      <ul class="dropdown-menu dropdown-menu-end border shadow-sm mt-2 rounded-3 py-2" style="min-width: 200px; border-color: #E5E7EB !important;">
        <li><a class="dropdown-item py-2 px-3 d-flex align-items-center gap-3 text-dark" href="#" style="font-size: 0.9rem;">
          <svg class="text-secondary" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Mi Perfil
        </a></li>
        <li><a class="dropdown-item py-2 px-3 d-flex align-items-center gap-3 text-dark" href="#" style="font-size: 0.9rem;">
          <svg class="text-secondary" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Configuración
        </a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item py-2 px-3 d-flex align-items-center gap-3 text-danger" href="#" style="font-size: 0.9rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Cerrar Sesión
        </a></li>
      </ul>
    </div>
  </div>
</header>
