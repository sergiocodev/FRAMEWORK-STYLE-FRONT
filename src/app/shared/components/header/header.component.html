<header class="bg-white border-bottom px-4 py-3 d-flex align-items-center justify-content-between sticky-top z-3" style="height: 70px;">
  
  <!-- Left Side: Search Bar (Global) -->
  <div class="d-flex align-items-center" style="width: 300px;">
    <div class="input-group bg-light rounded-3 overflow-hidden border-0">
      <span class="input-group-text bg-transparent border-0 text-muted pe-1" id="global-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input type="text" class="form-control border-0 ps-1 bg-transparent shadow-none" placeholder="Buscar en STYLE..." aria-label="Buscar" aria-describedby="global-search" style="font-size: 0.9rem;">
    </div>
  </div>

  <!-- Right Side: User Controls -->
  <div class="d-flex align-items-center gap-4">
    
    <!-- Notifications -->
    <div class="position-relative cursor-pointer text-secondary hover-text-primary">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle" style="width: 10px; height: 10px;">
        <span class="visually-hidden">Nuevas notificaciones</span>
      </span>
    </div>

    <!-- Divider -->
    <div style="height: 24px; width: 1px; background-color: #e2e8f0;"></div>

    <!-- User Profile Dropdown -->
    <div class="dropdown">
      <div class="d-flex align-items-center gap-2 cursor-pointer" data-bs-toggle="dropdown" aria-expanded="false">
        <img [src]="user.avatarUrl" alt="Avatar" class="rounded-circle border" width="36" height="36">
        <div class="d-none d-md-block">
          <div class="text-dark fw-bold mb-0" style="font-size: 0.85rem; line-height: 1.1;">{{ user.name }}</div>
          <div class="text-secondary" style="font-size: 0.75rem;">Admin</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-secondary ms-1"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      
      <ul class="dropdown-menu dropdown-menu-end border-0 shadow mt-2 rounded-3 py-2" style="min-width: 200px;">
        <li><a class="dropdown-item py-2 px-3 d-flex align-items-center gap-3 text-dark" href="#" style="font-size: 0.9rem;">
          <svg class="text-secondary" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Mi Perfil
        </a></li>
        <li><a class="dropdown-item py-2 px-3 d-flex align-items-center gap-3 text-dark" href="#" style="font-size: 0.9rem;">
          <svg class="text-secondary" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Configuración
        </a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item py-2 px-3 d-flex align-items-center gap-3 text-danger" href="#" style="font-size: 0.9rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Cerrar Sesión
        </a></li>
      </ul>
    </div>
  </div>
</header>
